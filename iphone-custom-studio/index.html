<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Design and preview a custom iPhone style in real time.">
  <title>iPhone Custom Studio</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#050505;overflow:hidden}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
    .shell{position:fixed;inset:0;background:#050505}
    .loader{position:absolute;inset:0;display:grid;place-items:center;z-index:0;background:radial-gradient(circle at 50% 40%,#202020,#050505 62%)}
    .loader-inner{display:grid;justify-items:center;gap:16px}
    .mark{width:46px;height:46px;border:1px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
    .label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.62)}
    iframe{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0;background:#050505}
    .fallback{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:2;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.55);white-space:nowrap;pointer-events:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){.fallback{font-size:9px}.mark{width:38px;height:38px}}
    @media(prefers-reduced-motion:reduce){.mark{animation:none;border-color:rgba(255,255,255,.55)}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="loader" aria-hidden="true">
      <div class="loader-inner"><span class="mark"></span><span class="label">Loading Studio</span></div>
    </div>
    <iframe
      src="https://www.claudeusercontent.com/artifact/51ca3239-6154-4c28-bc73-e69a6d75c563?domain=tty213589-bit.github.io&amp;errorReportingMode=parent&amp;formattedSpreadsheets=true"
      title="iPhone Custom Studio"
      allow="clipboard-write"
      allowfullscreen
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <div class="fallback">iPhone Custom Studio · Interactive Preview</div>
  </main>
</body>
</html>
